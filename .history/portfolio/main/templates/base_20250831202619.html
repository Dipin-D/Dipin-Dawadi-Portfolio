<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Dipin Dawadi">
    <meta property="og:description" content="My Journey, Achievements, and Skills">
    <meta property="og:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta property="og:url" content="https://dipindawadi.com.np">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dipin Dawadi">
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dipin Dawadi">
    <meta name="twitter:description" content="My Journey, Achievements, and Skills">
    <meta name="twitter:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta name="twitter:creator" content="@dipindawadi">
    <!-- Favicon -->
    <link rel="icon" href="https://dipindawadi.com.np/path/to/favicon.ico" type="image/x-icon">
    <title>{% block title %}Dipin Dawadi{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Main CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>

    <!-- Three.js Canvas (Behind Particles.js) -->
    <canvas id="three-js-canvas" style="position: fixed; top:0; left:0; width:100%; height:100%; z-index:-2;"></canvas>

    <!-- Header -->
    <header style="position: relative; overflow: hidden;">
        <div class="header-content">
            <h1>Dipin Dawadi</h1>
            <p>My Journey, Achievements, and Skills</p>
        </div>
    </header>

    <!-- Particles.js (keep existing div intact) -->
    <div id="particles-js"></div>

    <!-- Page Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <a href="https://www.linkedin.com/in/dipin-dawadi/" target="_blank">
            LinkedIn <i class="fab fa-linkedin"></i>
        </a>
        <a href="https://github.com/Dipin-D/Dipin-Portfolio" target="_blank">
            Github <i class="fab fa-github"></i>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>

    <script>
        // GSAP Scroll Animations
        gsap.utils.toArray('section').forEach(section => {
            gsap.from(section, {
                opacity: 0,
                y: 50,
                duration: 1,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: section,
                    start: 'top 80%',
                    toggleActions: 'play none none none'
                }
            });
        });

        // Particles.js config (unchanged)
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle", "stroke": { "width": 0 }, "polygon": { "nb_sides": 5 } },
                "opacity": { "value": 0.5 },
                "size": { "value": 1, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });

        // Three.js 3D Starfield
        let scene, camera, renderer, stars, starGeo;
        const starCount = 10000;
        let mouseX = 0, mouseY = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI / 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('three-js-canvas') });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x121212, 1);

            starGeo = new THREE.BufferGeometry();
            const positions = [];
            for (let i = 0; i < starCount; i++) {
                positions.push(Math.random() * 600 - 300, Math.random() * 600 - 300, Math.random() * 600 - 300);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouseX = event.clientX - window.innerWidth / 2;
            mouseY = event.clientY - window.innerHeight / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const positions = starGeo.attributes.position.array;
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] -= 0.5;
                if (positions[i] < -200) positions[i] = 200;
            }
            starGeo.attributes.position.needsUpdate = true;

            stars.rotation.y += mouseX * 0.00001;
            stars.rotation.x += mouseY * 0.00001;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        }
    </script>
</body>
</html>
