<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Dipin Dawadi">
    <meta property="og:description" content="My Journey, Achievements, and Skills">
    <meta property="og:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta property="og:url" content="https://dipindawadi.com.np">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dipin Dawadi">
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dipin Dawadi">
    <meta name="twitter:description" content="My Journey, Achievements, and Skills">
    <meta name="twitter:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta name="twitter:creator" content="@dipindawadi">
    <!-- Favicon -->
    <link rel="icon" href="https://dipindawadi.com.np/path/to/favicon.ico" type="image/x-icon">
    <title>{% block title %}Dipin Dawadi{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Main CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <header style="position: relative; overflow: hidden;">
  
    <!-- Centered Text -->
    <div class="header-content">
      <h1>Dipin Dawadi</h1>
      <p>My Journey, Achievements, and Skills</p>
    </div>
  </header>
  
  <div id="particles-js"></div>

    <div class="content">
      
        {% block content %}{% endblock %}
    </div>

    <!-- Footer with class "footer" added -->
    <footer class="footer">
      <a href="https://www.linkedin.com/in/dipin-dawadi/" target="_blank">
         LinkedIn <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://github.com/Dipin-D/Dipin-Portfolio" target="_blank">
          Github <i class="fab fa-github"></i>
      </a>
  </footer>
  

    <script>
        // Smooth scrolling for navigation
        document.querySelectorAll('nav ul li a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
    <!-- Particles.js Library -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // Three.js Configuration for a Star Field
    const container = document.getElementById('three-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // --- Create the Stars ---
    const starCount = 5000;
    const starGeometry = new THREE.BufferGeometry();
    const starVertices = [];

    // Generate random star positions
    for (let i = 0; i < starCount; i++) {
        const x = THREE.MathUtils.randFloatSpread(2000); // Spread across a 3D box
        const y = THREE.MathUtils.randFloatSpread(2000);
        const z = THREE.MathUtils.randFloatSpread(2000);
        starVertices.push(x, y, z);
    }

    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));

    // Create the star material
    const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1.5,
        sizeAttenuation: true, // Stars appear smaller the farther they are
        blending: THREE.AdditiveBlending, // Makes stars glow
        transparent: true,
        opacity: 0.8
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);
    // --- End Star Creation ---

    camera.position.z = 1000; // Place the camera inside the star field

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);

        // Gently rotate the star field to create a drifting effect
        stars.rotation.x += 0.0002;
        stars.rotation.y += 0.0002;

        renderer.render(scene, camera);
    }

    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
