<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Starfield</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000; /* dark background for stars */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="three-js-canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
  <script>
    const canvas = document.getElementById('three-js-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 1;
    camera.rotation.x = Math.PI/2;

    const renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Create star geometry
    const starCount = 10000;
    const positions = new Float32Array(starCount * 3);
    for(let i = 0; i < starCount * 3; i++) {
      positions[i] = Math.random() * 600 - 300;
    }

    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
    const stars = new THREE.Points(starGeo, starMaterial);
    scene.add(stars);

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (event) => {
      mouseX = event.clientX - window.innerWidth / 2;
      mouseY = event.clientY - window.innerHeight / 2;
    });

    function animate() {
      requestAnimationFrame(animate);

      const positions = starGeo.attributes.position.array;
      for(let i=2; i<positions.length; i+=3){
        positions[i] -= 0.5;
        if(positions[i] < -200) positions[i] = 200;
      }
      starGeo.attributes.position.needsUpdate = true;

      stars.rotation.y += mouseX * 0.00001;
      stars.rotation.x += mouseY * 0.00001;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
