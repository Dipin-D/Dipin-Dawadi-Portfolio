<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Dipin Dawadi">
    <meta property="og:description" content="My Journey, Achievements, and Skills">
    <meta property="og:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta property="og:url" content="https://dipindawadi.com.np">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dipin Dawadi">
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dipin Dawadi">
    <meta name="twitter:description" content="My Journey, Achievements, and Skills">
    <meta name="twitter:image" content="https://dipindawadi.com.np/static/image.JPG">
    <meta name="twitter:creator" content="@dipindawadi">
    <!-- Favicon -->
    <link rel="icon" href="https://dipindawadi.com.np/path/to/favicon.ico" type="image/x-icon">
    <title>{% block title %}Dipin Dawadi{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Main CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <header style="position: relative; overflow: hidden;">
  
    <!-- Centered Text -->
    <div class="header-content">
      <h1>Dipin Dawadi</h1>
      <p>My Journey, Achievements, and Skills</p>
    </div>
  </header>
  
  <div id="particles-js"></div>

    <div class="content">
      
        {% block content %}{% endblock %}
    </div>

    <!-- Footer with class "footer" added -->
    <footer class="footer">
      <a href="https://www.linkedin.com/in/dipin-dawadi/" target="_blank">
         LinkedIn <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://github.com/Dipin-D/Dipin-Portfolio" target="_blank">
          Github <i class="fab fa-github"></i>
      </a>
  </footer>
  

    <script>
        // Smooth scrolling for navigation
        document.querySelectorAll('nav ul li a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
    <!-- Particles.js Library -->

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
  particlesJS("particles-js", {
    "particles": {
      "number": {
        "value": 200, // Greatly increased particle count for a dense star field
        "density": {
          "enable": true,
          "value_area": 1500 // Expanded area to make the universe feel vast
        }
      },
      "color": { "value": "#ffffff" },
      "shape": {
        "type": "circle", // Simple circles are best for a realistic star look
        "stroke": { "width": 0, "color": "#000000" },
        "polygon": { "nb_sides": 5 }
      },
      "opacity": {
        "value": 0.7, // Slightly transparent particles
        "random": true, // Random opacity for a twinkling effect
        "anim": { "enable": false }
      },
      "size": {
        "value": 1.5, // Small particles to look like distant stars
        "random": true, // Random sizes to show stars of different magnitudes
        "anim": { "enable": false }
      },
      "line_linked": {
        "enable": true, // Enabled lines to create a subtle "constellation" or "cosmic web" effect
        "distance": 100,
        "color": "#ffffff",
        "opacity": 0.1, // Very low opacity to make the lines subtle
        "width": 1
      },
      "move": {
        "enable": true,
        "speed": 0.5, // Slower movement for a gentle, drifting effect
        "direction": "none", // No specific direction, creating a more random, natural feel
        "random": true,
        "straight": false,
        "out_mode": "out",
        "bounce": false
      }
    },
    "interactivity": {
      "detect_on": "canvas",
      "events": {
        "onhover": { "enable": true, "mode": "grab" }, // 'grab' is perfect for a gentle, interactive effect
        "onclick": { "enable": true, "mode": "push" },
        "resize": true
      },
      "modes": {
        "grab": { "distance": 150, "line_linked": { "opacity": 0.5 } },
        "push": { "particles_nb": 4 },
        "repulse": { "distance": 100, "duration": 0.4 }
      }
    },
    "retina_detect": true
  });
</script>
</body>
</html>
