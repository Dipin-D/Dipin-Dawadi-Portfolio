<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dipin Dawadi{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Three.js Canvas for 3D stars -->
    <canvas id="three-js-canvas" style="position: fixed; top:0; left:0; width:100%; height:100%; z-index:-2;"></canvas>

    <!-- Header -->
    <header style="position: relative; overflow: hidden;">
        <div class="header-content">
            <h1>Dipin Dawadi</h1>
            <p>My Journey, Achievements, and Skills</p>
        </div>
    </header>

    <!-- Particles.js (keep exact ID for existing pages) -->
    <div id="particles-js"></div>

    <!-- Page Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <a href="https://www.linkedin.com/in/dipin-dawadi/" target="_blank">
            LinkedIn <i class="fab fa-linkedin"></i>
        </a>
        <a href="https://github.com/Dipin-D/Dipin-Portfolio" target="_blank">
            Github <i class="fab fa-github"></i>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Navbar toggle logic
        const menuToggle = document.querySelector('.menu-toggle');
        const navbar = document.querySelector('.navbar');
        const navItems = document.querySelectorAll('.navbar-item');
        let navOpen = false;

        if(menuToggle) {
            menuToggle.addEventListener('click', () => {
                navOpen = !navOpen;
                if (navOpen) {
                    navbar.classList.add('open');
                    gsap.fromTo(navItems,
                        { opacity: 0, y: -30 },
                        { opacity: 1, y: 0, stagger: 0.1, duration: 0.5, ease: 'expo.out' }
                    );
                } else {
                    gsap.to(navItems, {
                        opacity: 0,
                        y: -30,
                        duration: 0.3,
                        stagger: -0.1,
                        ease: 'expo.in',
                        onComplete: () => navbar.classList.remove('open')
                    });
                }
            });
        }

        // Scroll animations for sections
        gsap.utils.toArray('section').forEach(section => {
            gsap.from(section, {
                opacity: 0,
                y: 50,
                duration: 1,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: section,
                    start: 'top 80%',
                    toggleActions: 'play none none none'
                }
            });
        });

        // Three.js 3D Background
        let scene, camera, renderer, starGeo, stars, mouseX = 0, mouseY = 0;
        const canvas = document.getElementById('three-js-canvas');
        const starCount = 10000;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI / 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: canvas });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x121212, 1);

            starGeo = new THREE.BufferGeometry();
            const positions = [];
            for(let i = 0; i < starCount; i++) {
                positions.push(
                    Math.random() * 600 - 300,
                    Math.random() * 600 - 300,
                    Math.random() * 600 - 300
                );
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });

            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouseX = event.clientX - window.innerWidth / 2;
            mouseY = event.clientY - window.innerHeight / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const positions = starGeo.attributes.position.array;
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] -= 0.5;
                if (positions[i] < -200) positions[i] = 200;
            }
            starGeo.attributes.position.needsUpdate = true;

            stars.rotation.y += mouseX * 0.00001;
            stars.rotation.x += mouseY * 0.00001;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        }
    </script>
</body>
</html>
